<div class="city-autocomplete card">
  <div class="row">
    <!-- Estado: compacto, só sigla -->
    <div class="field state-field">
      <label>Estado</label>
      <select class="input state-select" [(ngModel)]="selectedState">
        <option value="">UF</option>
        @for (s of states(); track s.ibgeCode) {
          <option [value]="s.stateCode">{{ s.stateCode }}</option>
        }
      </select>
    </div>

    <!-- Cidade: ocupa o espaço restante -->
    <div class="field city-field">
      <label>Cidade</label>
      <div class="autocomplete-wrapper">
        <input
          class="input"
          type="text"
          placeholder="Digite o nome da cidade..."
          [(ngModel)]="cityQuery"
          (ngModelChange)="onCityInput()"
          [disabled]="!selectedState" />

        @if (showDropdown()) {
          <ul class="dropdown">
            @for (city of cities(); track city.ibgeCode) {
              <li (click)="selectCity(city)">{{ city.name }}</li>
            }
          </ul>
        }
      </div>
    </div>
  </div>
</div>
